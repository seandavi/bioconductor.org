<p>Packages added to Bioconductor in the current release. Packages in the
<a href="/packages/devel/BiocViews.html#___Software">development version</a> appear here
once they are part of a release.</p>

<% for package in recent_packages() %>
  <p><a class="symlink" href="/packages/<%=package[:package]%>/"><%=package[:package]%></a> <%= package[:title]%></p>

<blockquote><%= package[:description]%></blockquote>
<% end %>
