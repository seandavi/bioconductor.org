<p>Packages added to Bioconductor since the last release. They are available in the
<a href="/packages/devel/BiocViews.html#___Software">development version</a> of Bioconductor
and will be part of the next release.</p>

<% for package in recent_packages() %>

<blockquote><%= package[:description]%></blockquote>
<% end %>
